# TEMPORARY (M4.0b): the audio determinism spike on two amd64 runners. Removed in the same PR
# once its results are recorded in container/audio/README.md §Determinism.
name: audio-spike

on:
  pull_request:
    paths:
      - container/audio/spike/**
      - .github/workflows/audio-spike.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    name: spike-${{ matrix.side }}
    strategy:
      fail-fast: false
      matrix:
        side: [a, b]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: pyproject.toml
      - run: uv sync --locked
      - name: Render and audio images, built from the tree
        run: |
          uv run --locked cinewright-build-image --tag cinewright-render:spike
          echo "RENDER=cinewright-render:spike" >> "$GITHUB_ENV"
          start=$(date +%s)
          uv run --locked cinewright-build-image --kind audio --tag cinewright-audio:spike
          echo "audio image build: $(( $(date +%s) - start )) s"
          docker image inspect cinewright-audio:spike --format 'audio image size: {{.Size}} bytes'
      - run: container/audio/spike/run.sh "$RENDER" cinewright-audio:spike "spike-${{ matrix.side }}"
        env:
          # The runners have 2 CPUs.
          MIX_CPUS: "1 2"
          TAKE_CPUS: "1 2"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spike-${{ matrix.side }}
          path: |
            spike-${{ matrix.side }}/**/*.json
            spike-${{ matrix.side }}/cpu.txt
