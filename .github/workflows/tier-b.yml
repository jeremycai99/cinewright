name: tier-b

# Tier B (M8.3b, D36): briefs through live agents and providers. It spends money, so it never runs
# on a pull request or a fork; only on a maintainer trigger. Decision 11 (revised 2026-11-25): one
# home-pack run per brief plus a pack-swap run, each capped by its brief's length, and no nightly
# schedule in v0.1.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: release (1 run per brief plus a pack-swap run) or nightly (1 run)
        type: choice
        options: [release, nightly]
        default: release
      month_cap_usd:
        description: stop starting runs past this spend (a release run's caps sum to 52)
        default: "52"
#  schedule:
#    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  tier-b:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: pyproject.toml
      - run: uv sync --locked
      - name: Tier B
        run: >-
          uv run --locked cinewright-eval tier-b --mode "${{ inputs.mode }}"
          --month-cap-usd "${{ inputs.month_cap_usd }}" --out tier-b-report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CINEWRIGHT_CASSETTE_MODE: "off"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tier-b-report
          path: tier-b-report
