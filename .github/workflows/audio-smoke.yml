# Builds the audio image on PRs that change it or the code that runs in it, then checks it
# matches its pins, imports the TTS and STT stacks with the network off (M4.0a), and runs the
# containerized-plugin tests: the plugin host (M4.5a) and the WhisperX plugin (M4.5b).
name: audio-smoke

on:
  pull_request:
    paths:
      - container/audio/**
      - tools/src/cinewright_tools/**
      - plugins/sdk-ts/**
      - plugins/sdk-py/**
      - plugins/stt-whisperx/**
      - engine/**
      - .github/workflows/audio-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audio-smoke-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audio-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: pyproject.toml
      - run: uv sync --locked
      - name: Build the audio image
        run: |
          start=$(date +%s)
          uv run --locked cinewright-build-image --kind audio --tag cinewright-audio:ci
          echo "build: $(( $(date +%s) - start )) s"
          docker image inspect cinewright-audio:ci --format 'size: {{.Size}} bytes'
      - name: Audio image container tests, none skipped
        run: |
          uv run --locked pytest tools/tests/test_audio_image.py -v -m container -rs | tee pytest.txt
          ! grep -q SKIPPED pytest.txt
        env:
          CINEWRIGHT_CONTAINER_TESTS: "1"
          CINEWRIGHT_AUDIO_IMAGE: cinewright-audio:ci
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Containerized plugin tests, none skipped
        env:
          CINEWRIGHT_CONTAINER_TESTS: "1"
          CINEWRIGHT_AUDIO_IMAGE: cinewright-audio:ci
        run: |
          pnpm --filter @cinewright/plugin-sdk exec vitest run test/container.test.ts \
            --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/sdk.json"
          pnpm --filter @cinewright/engine exec vitest run test/stt-whisperx.container.test.ts \
            --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/engine.json"
          for f in sdk engine; do
            jq -e '.numPendingTests == 0 and .numTodoTests == 0' "$RUNNER_TEMP/$f.json" > /dev/null \
              || { echo "$f: container tests were skipped"; exit 1; }
          done
