<!doctype html>
<!--
  Render-container smoke fixture (M0.2): 1280x720, 30 fps, 2 s, one text element and one box.
  Test content, not a style: it only has to exercise text, layout and motion deterministically.
  Motion is WAAPI: paused animations that HyperFrames seeks (data-no-timeline, no GSAP).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #ffffff;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: "Noto Sans", sans-serif;
      }
      #label {
        position: absolute;
        left: 120px;
        top: 280px;
        color: #111111;
        font-size: 64px;
        font-weight: 600;
      }
      #box {
        position: absolute;
        left: 120px;
        top: 420px;
        width: 160px;
        height: 160px;
        background: #2f6fde;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="hello"
      data-start="0"
      data-duration="2"
      data-width="1280"
      data-height="720"
      data-no-timeline
    >
      <h1 id="label" class="clip" data-start="0" data-duration="2" data-track-index="0">Hello, world</h1>
      <div id="box" class="clip" data-start="0" data-duration="2" data-track-index="1"></div>
    </div>
    <script>
      const label = document.getElementById("label").animate(
        [
          { opacity: 0, transform: "translateY(24px)" },
          { opacity: 1, transform: "translateY(0)" },
        ],
        { duration: 600, easing: "cubic-bezier(0.33, 1, 0.68, 1)", fill: "both" },
      );
      const box = document.getElementById("box").animate(
        [
          { transform: "translateX(0) rotate(0deg)" },
          { transform: "translateX(840px) rotate(90deg)" },
        ],
        { delay: 200, duration: 1600, easing: "cubic-bezier(0.45, 0, 0.55, 1)", fill: "both" },
      );
      label.pause();
      box.pause();
    </script>
  </body>
</html>
