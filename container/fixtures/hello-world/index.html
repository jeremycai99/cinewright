<!doctype html>
<!--
  Render-container smoke fixture (M0.2): 1280x720, 30 fps, 2 s, one text element and one box.
  Test content, not a style: it only has to exercise text, layout and motion deterministically.
  GSAP loads by relative path; render-job adds vendor/gsap.min.js to the work copy.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #ffffff;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: "Noto Sans", sans-serif;
      }
      #label {
        position: absolute;
        left: 120px;
        top: 280px;
        color: #111111;
        font-size: 64px;
        font-weight: 600;
      }
      #box {
        position: absolute;
        left: 120px;
        top: 420px;
        width: 160px;
        height: 160px;
        background: #2f6fde;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="hello"
      data-start="0"
      data-duration="2"
      data-width="1280"
      data-height="720"
    >
      <h1 id="label" class="clip" data-start="0" data-duration="2" data-track-index="0">Hello, world</h1>
      <div id="box" class="clip" data-start="0" data-duration="2" data-track-index="1"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#label", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 0);
      tl.fromTo("#box", { x: 0, rotation: 0 }, { x: 840, rotation: 90, duration: 1.6, ease: "power1.inOut" }, 0.2);
      window.__timelines["hello"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
