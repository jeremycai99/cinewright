[project]
name = "cinewright-tools"
version = "0.0.0"
description = "Repository checks and the render-container runner for Cinewright."
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "pyyaml==6.0.3",
]

[project.scripts]
cinewright-check-boundaries = "cinewright_tools.boundaries:main"
cinewright-check-workflows = "cinewright_tools.workflows:main"
cinewright-check-pins = "cinewright_tools.pins:main"
cinewright-build-image = "cinewright_tools.pins:build_main"
cinewright-render-in-container = "cinewright_tools.container:main"
cinewright-check-in-container = "cinewright_tools.container:check_main"
cinewright-check-specimens = "cinewright_tools.specimens:main"
cinewright-check-image-lock = "cinewright_tools.image_lock:main"

[build-system]
requires = ["uv_build==0.13.8"]
build-backend = "uv_build"
