# Virtual uv workspace root. Members are listed below; no package is built from the root.

[tool.uv]
required-version = "==0.13.8"

[tool.uv.workspace]
members = ["core/py", "eval", "plugins/sdk-py", "plugins/stt-whisperx", "tools"]
# The audio image has its own Python (3.12) and lock.
exclude = ["container/audio"]

[dependency-groups]
dev = ["datamodel-code-generator==0.96.0", "pytest==9.2.0", "ruff==0.17.5"]

[tool.pytest.ini_options]
testpaths = ["core/py/tests", "eval/tests", "plugins/sdk-py/tests", "plugins/stt-whisperx/tests", "tools/tests"]
addopts = ["--import-mode=importlib"]
cache_dir = ".cache/pytest"
markers = [
    "container: needs Docker and the render image (runs only with CINEWRIGHT_CONTAINER_TESTS=1)",
]

[tool.ruff]
target-version = "py313"
line-length = 100
cache-dir = ".cache/ruff"
extend-exclude = ["**/*.md", "core/py/src/cinewright_ir/models.py"]

[tool.ruff.per-file-target-version]
# Plugins and their SDK run on the audio image's Python 3.12 (M4).
"plugins/sdk-py/**" = "py312"
"plugins/stt-whisperx/**" = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["cinewright_eval", "cinewright_ir", "cinewright_plugin_sdk", "cinewright_stt_whisperx", "cinewright_tools"]

[tool.pyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
include = ["core/py", "eval", "plugins/sdk-py", "plugins/stt-whisperx", "tools"]
exclude = ["**/node_modules", "**/.venv", "tools/tests/fixtures"]
strict = ["core/py/src", "eval/src", "plugins/sdk-py/src", "tools/src"]
