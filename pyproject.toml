# Virtual uv workspace root. Members are listed below; no package is built from the root.

[tool.uv]
required-version = "==0.13.8"

[tool.uv.workspace]
members = ["core/py", "plugins/sdk-py", "tools"]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.5"]

[tool.pytest.ini_options]
testpaths = ["core/py/tests", "plugins/sdk-py/tests", "tools/tests"]
addopts = ["--import-mode=importlib"]
markers = [
    "container: needs Docker and the render image (runs only with CINEWRIGHT_CONTAINER_TESTS=1)",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["**/*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["cinewright_ir", "cinewright_plugin_sdk", "cinewright_tools"]

[tool.pyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
include = ["core/py", "plugins/sdk-py", "tools"]
exclude = ["**/node_modules", "**/.venv", "tools/tests/fixtures"]
strict = ["core/py/src", "plugins/sdk-py/src", "tools/src"]
